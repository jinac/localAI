services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    pull_policy: "always"
    #tty: true
    ports:
      - ${LLAMACPP_PORT}:8080
    volumes:
      - ./models:/models
    #environment:
    #  - LLAMA_ARG_N_GPU_LAYERS=999
    command: >
      --models-dir /models
      --models-max 1
      --flash-attn on
      --n-gpu-layers 99
      --ctx-size 262144
      --reasoning-format deepseek
      --cont-batching
      --jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    pull_policy: "always"
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - llamacpp
    ports:
      - ${OWUI_PORT}:8080
    environment:
      - "OPENAI_API_BASE_URLS=${LLAMACPP_BASE_URL}:8080"
      - "OPENAI_API_KEY=none"
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
