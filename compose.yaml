services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    pull_policy: "always"
    #tty: true
    ports:
      - ${LLAMACPP_PORT}:8080
    volumes:
      - ./models:/models
    #environment:
    #  - LLAMA_ARG_N_GPU_LAYERS=999
    command: >
      --models-dir /models
      --models-max 1
      --flash-attn on
      --n-gpu-layers 99
      --ctx-size 262144
      --reasoning-format deepseek
      --cont-batching
      --jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped
